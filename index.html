  #app{display:grid;height:100dvh;min-height:100dvh;grid-template-rows:auto 48px minmax(min-content,1fr) 27px}
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand files" "title modes";height:auto;min-height:110px;align-content:start;align-items:center;gap:6px 8px;padding:6px 12px}
  .topbar .brand{grid-area:brand;min-width:0;max-width:none;gap:7px;min-height:44px;align-self:stretch}
  .topbar .brand svg{width:23px;height:29px;flex-shrink:0}
  .topbar .brand span{font-size:14px;line-height:1.35}
  .topbar .brand small{font-size:9px;letter-spacing:1px}
  .topbar .file-tools{grid-area:files;min-width:0;gap:0;justify-self:end}
  .topbar .file-tools button{min-height:44px;font-size:11px;padding:6px 7px}
  .topbar .file-tools button.accent{padding:6px 9px}
  .topbar #title{grid-area:title;order:initial;width:100%;min-width:0;min-height:44px;height:100%;padding:8px 0;font-size:13px;line-height:1.5;align-self:stretch}
  .topbar .mode-switch{grid-area:modes;order:initial;min-width:0;margin:0;padding:2px;gap:2px;justify-self:end}
  .topbar .mode-switch button{min-height:44px;padding:6px 8px;font-size:11px}
  .workspace{position:relative;height:auto;min-height:0}
  .sidebar,.inspector{position:absolute;top:0;bottom:0;max-width:90vw}
  .presenting #app{grid-template-rows:auto minmax(min-content,1fr)}
  .presenting .workspace{height:auto}
}

.asset-button svg{width:82px;height:62px}.catalog-choice svg{width:78px;height:92px}.property-nav button{white-space:normal}.field a,.hint a{color:var(--teal)}

.view-menu{position:relative;flex-shrink:0}

.view-menu>div{position:absolute;z-index:24;right:0;top:calc(100% + 4px);width:min(240px,85vw);display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 7px 24px #17394c23}

.selected-actions button,.playbar button{white-space:nowrap}

#route-settings{padding-inline:7px;font-size:11px}
.object-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin:5px 0}

}

    node.frame=frame;node.distance=fraction;previous=frame;
  }
  for(let i=1;i<nodes.length;i++){
    const a=nodes[i-1],b=nodes[i];
    C.setDrawnLeg(a.frame,b.frame,C.sliceMotionPieces(path,a.distance,b.distance),route);
  }
  if(route.holdAfter?.size||route.hold)nodes.at(-1).frame.motionToNext='straight';
  // Retained mark/flag/sail edits beyond the newly drawn end stay at their own
  // times on the endpoint and do not extend the authored route itself.
  for(const frame of framesAfter.filter(f=>f.time>last.time&&route.holdAfter?.has(f.id))){
    frame.point={...nodes.at(-1).frame.point};frame.heading=nodes.at(-1).frame.heading;
    discardGeometry(frame);frame.motionToNext='straight';
  }
  track.keyframes=[...framesBefore,...nodes.map(node=>node.frame),...framesAfter];
  const discarded=oldSamples.filter(frame=>!used.has(frame.id));
  for(const frame of discarded)delete scene.studio.frames[frame.id];
  return {scene,routeId:route.id,start:first.time,end:last.time,frameIds:nodes.map(node=>node.frame.id)};
}

function rebaseBoatEdits(scene,track,touchedIds){
  if(!scene.studio?.timeline)return;
  const byId=new Map(track.keyframes.map(frame=>[frame.id.toLowerCase(),frame]));
  scene.studio.timeline.events=events(scene).filter(event=>{
    const previous=event.boatEdits??[];
    if(!previous.length)return true;
    event.boatEdits=previous.filter(edit=>{
      const id=edit.frameId.toLowerCase();
      if(!sameId(edit.trackId,track.id)||!touchedIds.has(id))return true;
      const frame=byId.get(id);
      if(!frame)return false;
      for(const name of ['before','after'])if(edit[name])edit[name]={...C.clone(frame),...frameSettings(edit[name])};
      edit.timeBound=!!edit.after&&sameTime(edit.after.time,event.time);
      return !equal(edit.before,edit.after)||!equal(edit.beforeMeta,edit.afterMeta);
    });
    return event.boatEdits.length||event.changes.length||Object.keys(event).some(key=>!['id','time','changes','boatEdits'].includes(key));
  });
}

function authoredSceneEnd(scene){
  let end=0;
  const trackEnd=track=>{for(const frame of track?.keyframes??[])end=Math.max(end,frame.time);};
  for(const track of scene.tracks??[])trackEnd(track);
  for(const event of events(scene)){
    end=Math.max(end,event.time);
    for(const change of event.changes)if(change.path[0]==='tracks'){
      for(const track of Array.isArray(change.value)?change.value:[change.value])trackEnd(track);
    }
  }
  for(const event of scene.windEvents??[])end=Math.max(end,event.time??0);
  for(const step of scene.studio?.lesson?.steps??[])if(Number.isFinite(step.time))end=Math.max(end,step.time);
  return end;
}

function matchingPath(a,b,scale){
  const length=Math.max(C.motionPathLength(a),C.motionPathLength(b));
  const count=Math.min(4096,Math.max(64,Math.ceil(length*scale/3)));
  for(let i=0;i<=count;i++)if(distance(C.pointOnSegment(a,i/count),C.pointOnSegment(b,i/count))>EPS)return false;
  return true;
}

function saveStroke(scene,key,track,metadata){
  const span=routeSpans(track).find(route=>sameId(route.key,key));
  if(!span)return;
  scene.studio.drawnRoutes??={};
  scene.studio.drawnRoutes[key]={...metadata,version:1,baselinePieces:span.legs.flatMap(C.timedMotionPieces)};
}

function arcPosition(points,fraction){
  const target=strokeLength(points)*fraction;
  let at=0;
  for(let i=1;i<points.length;i++){
    const length=distance(points[i-1],points[i]);
    if(at+length>=target-EPS){const t=length?Math.max(0,Math.min(1,(target-at)/length)):0;return {index:i-1,point:{x:interpolate(points[i-1].x,points[i].x,t),y:interpolate(points[i-1].y,points[i].y,t)}};}
    at+=length;
  }
  return {index:points.length-2,point:{...points.at(-1)}};
}

function alignFittedJunction(before,after,scale,heading){
  if(!before?.length||!after?.length)return;
  const left=before.at(-1),right=after[0];
  if(Math.min(distance(left.from,left.to),distance(right.from,right.to))<=EPS)return;
  if(!Number.isFinite(heading)){
    const start=C.tangentHeading(C.drawnMotionPath([left]),1),end=C.tangentHeading(C.drawnMotionPath([right]),0);
    const change=C.shortestAngle(start,end);
    if(Math.abs(change)>150)return;
    heading=C.normalizeAngle(start+change/2);
  }
  alignFitJunction(left,right,heading,scale);
}

function constrainedPieces(stroke,anchors,path,options){
  const length=strokeLength(stroke),positions=[0];
  let minimum=0;
  for(const anchor of anchors.slice(1,-1)){
    const point=anchor.frame.point,expected=anchor.distance*length;
    let best={at:expected,error:Infinity},at=0;
    for(let i=1;i<stroke.length;i++){
      const a=stroke[i-1],b=stroke[i],dx=b.x-a.x,dy=b.y-a.y,segment=distance(a,b);
      const t=segment?Math.max(0,Math.min(1,((point.x-a.x)*dx+(point.y-a.y)*dy)/(segment*segment))):0;
      const position=at+t*segment;
      if(position>minimum+EPS&&Math.abs(position-expected)<=Math.max(length*.15,24/options.scale)){
        const error=distance(point,{x:a.x+t*dx,y:a.y+t*dy})+Math.abs(position-expected)*.0001;
        if(error<best.error)best={at:position,error};
      }
      at+=segment;
    }
    minimum=Math.max(minimum,best.at);positions.push(minimum);
  }
  positions.push(length);
  const chunks=[];
  for(let i=1;i<anchors.length;i++){
    const a=anchors[i-1],b=anchors[i],start=arcPosition(stroke,length?positions[i-1]/length:0),end=arcPosition(stroke,length?positions[i]/length:1);
    const from=a.frame?.point??C.pointOnSegment(path,a.distance),to=b.frame?.point??C.pointOnSegment(path,b.distance);
    const raw=[{...from},...stroke.slice(start.index+1,end.index+1),{...to}];
    const fitted=fitRouteStroke(raw,{...options,
      startHeading:i===1?options.startHeading:undefined,endHeading:i===anchors.length-1?options.endHeading:undefined});
    chunks.push(fitted.length?fitted:[{from:{...from},to:{...to},control1:{...from},control2:{...to}}]);
  }
  for(let i=1;i<chunks.length;i++){
    const frame=anchors[i].frame;
    alignFittedJunction(chunks[i-1],chunks[i],options.scale,frame?.headingManual===true?frame.heading:undefined);
  }
  return chunks.flatMap((fitted,i)=>{
    const lengths=fitted.map(piece=>C.motionPathLength(C.drawnMotionPath([piece]))),total=lengths.reduce((sum,value)=>sum+value,0);
    const weight=anchors[i+1].distance-anchors[i].distance;
    return fitted.map((piece,j)=>({...piece,weight:weight*(total?lengths[j]/total:1/fitted.length)}));
  });
}

function commitDrawnRoute(scene,trackId,points,{duration,interval,sampling,count,replaceFromId,tolerance,scale=1,smoothing}={}){
  const next=C.clone(scene),track=findTrackStorage(next,trackId),origin=routeOrigin(next,trackId,{replaceFromId});
  if(!track||!origin)throw Error('找不到要画航线的船位');
  const defaults=drawnRouteDefaults(next);
  smoothing??=defaults.smoothing;
  sampling=samplingMode(sampling,interval===undefined?defaults.sampling:'interval');
  duration??=defaults.duration;interval??=defaults.interval;count??=defaults.count??0;
  const start=origin.time,end=roundTime(start+duration);
  validateRouteSettings({start,duration,interval,sampling,count});
  const stroke=rawStroke(origin.point,points);
  const startHeading=routeStartHeading(next,trackId,{replaceFromId});
  const path=C.drawnMotionPath(fittedPieces(origin.point,stroke,{tolerance,scale,smoothing,startHeading,startConflict:'error'}));
  const frames=C.orderedFrames(track),originIndex=frames.indexOf(origin),future=frames.slice(originIndex+1);
  const explicitSettings=settingEdits(next,track.id);
  const retained=future.filter((frame,i)=>
    frame.headingManual===true||explicitSettings.has(frame.id.toLowerCase())||hasSettingChange(next,i?future[i-1]:origin,frame));
  const anchors=[{time:start,distance:0,frame:origin}];
  for(const frame of retained)if(frame.time<end-EPS)anchors.push({time:frame.time,distance:(frame.time-start)/duration,frame});
  const endFrame=retained.find(frame=>sameTime(frame.time,end));
  anchors.push({time:end,distance:1,frame:endFrame});
  const framesAfter=retained.filter(frame=>frame.time>end+EPS);
  const oldSamples=future.filter(frame=>!retained.includes(frame));
  C.freezeMotionLegs(track,C.pathSegments(track).filter(leg=>leg.end.time<=start));
  const route={id:C.uuid(),interval,sampling,count,holdAfter:new Set(framesAfter.map(frame=>frame.id))};
  const result=putRoute(next,track,frames.slice(0,originIndex),framesAfter,path,anchors,oldSamples,route);
  rebaseBoatEdits(next,track,new Set([origin,...future].map(frame=>frame.id.toLowerCase())));
  saveStroke(next,route.id,track,{rawStroke:stroke,scale,smoothing:tolerance===undefined?smoothing:null,source:'stroke',fitVersion:ROUTE_FIT_VERSION});
  next.duration=Math.max(next.duration??0,end);
  next.studio.drawnRouteDefaults={duration,interval,sampling,...(sampling==='count'?{count}:{}),smoothing};
  return {...result,preservedTimes:retained.map(frame=>frame.time)};
}

function resampleDrawnRoute(scene,trackId,routeId,{duration,interval,sampling,count,scale,smoothing}={}){
  const next=C.clone(scene),track=findTrackStorage(next,trackId);
  const route=track&&routeSpans(track).find(item=>sameId(item.key,routeId));
  if(!route)throw Error('找不到要调整的手绘航线');
  const {legs}=route,first=legs[0].start,last=legs.at(-1).end,start=first.time;
  const oldEnd=last.time;
  sampling=samplingMode(sampling,interval===undefined?route.sampling:'interval');
  duration??=roundTime(oldEnd-start);interval??=route.interval;
  const sameDuration=sameTime(duration,oldEnd-start);
  const end=sameDuration?oldEnd:roundTime(start+duration),keepClock=sameDuration&&smoothing===undefined;
  const frames=C.orderedFrames(track),framesBefore=frames.slice(0,frames.indexOf(first)),framesAfter=frames.slice(frames.indexOf(last)+1);
  if(framesAfter[0]?.time<=end+EPS)throw Error('新航行时长会覆盖后续船位，请缩短时长');
  if(legs.every(leg=>C.motionPathLength(leg)<=EPS))throw Error('航线没有可播放的距离');
  const explicitSettings=settingEdits(next,track.id);
  const anchors=[{time:start,distance:0,frame:first}],oldSamples=[];
  for(const leg of legs){
    const frame=leg.end;
    if(frame===last)break;
    if(!canResampleSample(next,leg,route.id,explicitSettings)){
      if(frame.time>=end-EPS)throw Error('请保留已手动修改的船位时刻，或重画后续航线');
      anchors.push({time:frame.time,distance:(frame.time-start)/(oldEnd-start),frame});
    }else oldSamples.push(frame);
  }
  count??=oldSamples.length;
  validateRouteSettings({start,duration,interval,sampling,count},sameDuration);
  const keepEndTime=framesAfter.length>0||isEditedSample(last,route.id)||
    explicitSettings.has(last.id.toLowerCase())||hasSettingChange(next,legs.at(-1).start,last);
  if(keepEndTime&&end>oldEnd+EPS)throw Error('延长航行时长会覆盖已编辑的终点或后续航段');
  const hold=keepEndTime&&end<oldEnd-EPS;
  if(hold)framesAfter.unshift(last);
  anchors.push({time:end,distance:1,frame:hold?undefined:last,generated:!keepEndTime});
  if(keepClock)for(const anchor of anchors)anchor.fixedPoint={...anchor.frame.point};
  const pieces=legs.flatMap(C.timedMotionPieces);
  let path=C.drawnMotionPath(pieces);
  const saved=next.studio.drawnRoutes?.[route.key];
  scale??=saved?.scale??1;
  let metadata=saved;
  if(smoothing!==undefined){
    const original=saved?.baselinePieces?.length?C.drawnMotionPath(saved.baselinePieces):null;
    const reusable=saved?.rawStroke?.length>1&&original&&matchingPath(path,original,saved.scale??scale);
    if(reusable)scale=saved.scale??scale;
    const stroke=reusable?saved.rawStroke:pathTrace(path,scale,anchors.map(anchor=>anchor.distance));
    metadata={rawStroke:C.clone(stroke),scale,smoothing,source:reusable?saved.source:'edited-route',fitVersion:ROUTE_FIT_VERSION};
    const startHeading=routeStartHeading(next,trackId,{replaceFromId:first.id});
    const following=C.pathSegments(track).find(leg=>leg.start===last&&C.motionPathLength(leg)>EPS);
    const endHeading=following?C.tangentHeading(following,0):last.headingManual===true?last.heading:undefined;
    path=C.drawnMotionPath(constrainedPieces(stroke,anchors,path,{scale,smoothing,startHeading,endHeading,startConflict:'error'}));
    for(const anchor of anchors)if(anchor.frame)anchor.fixedPoint={...anchor.frame.point};
  }
  // Shortening can leave a hold before the existing start of the next leg.
  const followingLeg=last.drawnLeg;
  const finalMotion=last.motionToNext;
  C.freezeMotionLegs(track,C.pathSegments(track));
  const finalControls=last.motionControls;
  const result=putRoute(next,track,framesBefore,framesAfter,path,anchors,oldSamples,{id:route.id,interval,sampling,count,hold,keepClock});
  if(!hold){
    if(followingLeg)last.drawnLeg=followingLeg;
    if(finalMotion!==undefined)last.motionToNext=finalMotion;
    if(finalControls)last.motionControls=finalControls;
  }
  rebaseBoatEdits(next,track,new Set([first,...legs.map(leg=>leg.end)].map(frame=>frame.id.toLowerCase())));
  if(metadata)saveStroke(next,route.key,track,metadata);
  const sceneDuration=next.duration??0;
  next.duration=Math.max(sameTime(sceneDuration,oldEnd)?0:sceneDuration,end,authoredSceneEnd(next));
  next.studio.drawnRouteDefaults={duration,interval,sampling,...(sampling==='count'?{count}:{}),smoothing:metadata?.smoothing??drawnRouteDefaults(next).smoothing};
  return {...result,routeId:route.key};
}

function projectOnSegments(track,segments,position,{nearTime,branchTolerance=0}={}){
  if(!validPoint(position))throw Error('请选择航线上的位置');
  const candidates=[];
  const squared=p=>(p.x-position.x)**2+(p.y-position.y)**2;
  for(const segment of segments){
    if(segment.end.time<=segment.start.time||C.motionPathLength(segment)<=EPS)continue;
    const count=Math.min(4096,Math.max(32,(segment.pieces?.length??1)*12));
    const at=elapsed=>C.pointOnSegment(segment,C.motionParameterAtTime(segment,track.timingCurve,elapsed));
    const errors=Array.from({length:count+1},(_,i)=>squared(at(i/count)));
    for(let i=0;i<=count;i++){
      const error=errors[i];
      if(error>errors[i-1]||error>=errors[i+1])continue;
      let left=Math.max(0,(i-1)/count),right=Math.min(1,(i+1)/count);
      for(let iteration=0;iteration<36;iteration++){
        const a=left+(right-left)/3,b=right-(right-left)/3;
        if(squared(at(a))<=squared(at(b)))right=b;else left=a;
      }
      const center=(left+right)/2;
      const elapsed=error<=squared(at(center))?i/count:center,point=at(elapsed);
      candidates.push({trackId:track.id,point,time:roundTime(interpolate(segment.start.time,segment.end.time,elapsed)),
        distance:distance(position,point)});
    }
  }
  const closest=candidates.reduce((best,hit)=>!best||hit.distance<best.distance?hit:best,null);
  if(!closest||!Number.isFinite(nearTime))return closest;
  const limit=closest.distance+Math.max(EPS,branchTolerance);
  return candidates.reduce((best,hit)=>hit.distance<=limit&&Math.abs(hit.time-nearTime)<Math.abs(best.time-nearTime)?hit:best,closest);
}

/** Project within the selected pair of visible positions or the entire path. */
function projectOnRoute(scene,trackId,position,{startFrameId,endFrameId,nearTime,branchTolerance}={}){
  const track=findTrackStorage(scene,trackId);
  if(!track)return null;
  let segments=C.pathSegments(track);
  if(startFrameId!==undefined||endFrameId!==undefined){
    const start=segments.findIndex(leg=>sameId(leg.start.id,startFrameId));
    const end=segments.findIndex(leg=>sameId(leg.end.id,endFrameId));
    if(start<0||end<start)return null;
    segments=segments.slice(start,end+1);
  }
  return projectOnSegments(track,segments,position,{nearTime,branchTolerance});
}

function arrivalWindow(track,frameId){
  if(!track)return null;
  const frames=C.orderedFrames(track),index=frames.findIndex(frame=>sameId(frame.id,frameId));
  if(index<=0||index>=frames.length-1)return null;
  const frame=frames[index],start=frames[index-1].time,end=frames[index+1].time;
  if(frame.routeAnchor===true||frame.time<=start+EPS||frame.time>=end-EPS)return null;
  return {frame,start,end};
}

/** Open bounds are the two neighboring poses, including timed state anchors. */
function routePositionRange(scene,trackId,frameId){
  const window=arrivalWindow(findTrackStorage(scene,trackId),frameId);
  return window?{start:window.start,end:window.end,time:window.frame.time}:null;
}

function updateRouteSnapshots(scene,trackId,before,after,fields){
  for(const event of events(scene))for(const edit of event.boatEdits??[]){
    if(!sameId(edit.trackId,trackId)||!sameId(edit.frameId,before.id))continue;
    for(const side of ['before','after']){
      const snapshot=edit[side];
      if(!snapshot)continue;
      for(const field of fields)if(equal(snapshot[field],before[field])){
        if(after[field]===undefined)delete snapshot[field];
        else snapshot[field]=C.clone(after[field]);
      }
    }
    if(fields.includes('time'))edit.timeBound=!!edit.after&&sameTime(edit.after.time,event.time);
  }
}

/** Change only this boat's clock on each side of an existing path position. */
function setRouteArrival(scene,trackId,frameId,time){
  const next=C.clone(scene),track=findTrackStorage(next,trackId);
  const window=arrivalWindow(track,frameId);
  if(!window)throw Error('请选择这艘船的中间船位');
  const {frame,start,end}=window;
  if(!Number.isFinite(time)||time<=start+EPS||time>=end-EPS){
    throw Error(`到达时刻应在 ${start} 到 ${end} 秒之间`);
  }
  if(sameTime(frame.time,time))return {scene:next,frameId:frame.id,time:frame.time};
  const before=C.clone(frame);
  // Keeping the same neighbors preserves both stored and computed curve controls.
  frame.time=time;
  updateRouteSnapshots(next,trackId,before,frame,['time']);
  return {scene:next,frameId:frame.id,time};
}

/** Add one visible position without changing any curve or unrelated event. */
function addRoutePosition(scene,trackId,{time}={}){
  if(!Number.isFinite(time)||time<0||time>1e9)throw Error('船位时刻无效');
  const next=C.clone(scene),track=findTrackStorage(next,trackId);
  if(!track)throw Error('船只不存在');
  const frames=C.orderedFrames(track);
  if(!frames.length||time<frames[0].time-EPS||time>frames.at(-1).time+EPS)throw Error('请在这艘船的航线上添加船位');
  const existing=frames.find(frame=>sameTime(frame.time,time));
  if(existing){
    const hidden=existing.routeAnchor===true;
    delete existing.routeAnchor;
    if(hidden)for(const event of events(next))for(const edit of event.boatEdits??[]){
      if(!sameId(edit.trackId,track.id)||!sameId(edit.frameId,existing.id))continue;
      for(const side of ['before','after'])if(edit[side])delete edit[side].routeAnchor;
    }
    return {scene:next,frameId:existing.id,time:existing.time,created:false,shown:hidden};
  }
  if(track.keyframes.length>=3000)throw Error('这艘船的船位数量过多');
  const pose=C.poseAt(track,time),meta=frameMeta(next,pose);
  const frame=C.createFrame(next,{...pose,id:C.uuid(),time,meta});
  delete frame.drawnLeg;delete frame.drawnSample;delete frame.routeAnchor;delete frame.routePosition;
  const leg=C.pathSegments(track).find(leg=>leg.start.time<time&&time<leg.end.time);
  const previous=leg?.pieces?C.clone(leg.start):null;
  C.splitMotionAt(track,time,frame);
  if(previous)updateRouteSnapshots(next,trackId,previous,leg.start,['drawnLeg','motionControls','motionToNext']);
  track.keyframes.push(frame);
  track.keyframes.sort((a,b)=>a.time-b.time);
  return {scene:next,frameId:frame.id,time,created:true,shown:true};
}

function sectionPieces(segment){
  if(segment.pieces)return segment.pieces.map(piece=>({
    from:{...piece.start.point},to:{...piece.end.point},control1:{...piece.control1},control2:{...piece.control2},
    ...(piece.weight!==undefined?{weight:piece.weight}:{})
  }));
  const a=segment.start.point,b=segment.end.point;
  return [{from:{...a},to:{...b},
    control1:segment.smooth?{...segment.control1}:{x:interpolate(a.x,b.x,1/3),y:interpolate(a.y,b.y,1/3)},
    control2:segment.smooth?{...segment.control2}:{x:interpolate(a.x,b.x,2/3),y:interpolate(a.y,b.y,2/3)}
  }];
}

function canReshapeRoutePosition(scene,trackId,frameId){
  const track=findTrackStorage(scene,trackId);
  return !!(track?.keyframes?.length>1&&track.keyframes.some(frame=>sameId(frame.id,frameId)&&frame.routeAnchor!==true));
}

/** Carry the bend with the edited chord without amplifying it on short spans. */
function reshapeTrace(leg,from,to,scale){
  const start=leg.start.point,end=leg.end.point;
  const oldLength=distance(start,end),length=distance(from,to);
  if(length<=EPS||!leg.smooth||C.motionPathLength(leg)<=EPS)return [from,to];
  // Trace by geometry, ignoring weights used solely to vary playback speed.
  const geometry=C.drawnMotionPath(sectionPieces(leg).map(({weight,...piece})=>piece));
  const count=Math.min(256,Math.max(8,Math.ceil(C.motionPathLength(geometry)*scale/5)));
  const trace=Array.from({length:count+1},(_,i)=>C.pointOnSegment(geometry,i/count));
  if(oldLength<=EPS){
    // A deliberately closed leg has no chord direction to rotate.
    return trace.map((point,i)=>({
      x:point.x+interpolate(from.x-start.x,to.x-end.x,i/count),
      y:point.y+interpolate(from.y-start.y,to.y-end.y,i/count)
    }));
  }
  const ox=(end.x-start.x)/oldLength,oy=(end.y-start.y)/oldLength;
  const nx=(to.x-from.x)/length,ny=(to.y-from.y)/length;
  const bendScale=Math.min(1,length/oldLength);
  return trace.map((point,i)=>{
    if(i===0)return from;
    if(i===count)return to;
    const x=point.x-start.x,y=point.y-start.y;
    const along=(x*ox+y*oy)*length/oldLength,across=(y*ox-x*oy)*bendScale;
    return {x:from.x+along*nx-across*ny,y:from.y+along*ny+across*nx};
  });
}

/** Keep an existing pause or pace pattern while fitting a different shape. */
function paceReshapedPieces(track,leg,pieces){
  const variablePace=leg.pieces?leg.pieces.some(piece=>Number.isFinite(piece.weight)&&piece.weight>0):
    ['逐渐加速','逐渐减速','先加速后减速'].includes(track.timingCurve);
  if(!variablePace||C.motionPathLength(leg)<=EPS)return pieces;
  const shape=C.drawnMotionPath(pieces);
  if(C.motionPathLength(shape)<=EPS)return pieces;
  const steps=20,cuts=[0];
  const at=t=>C.pointOnSegment(leg,C.motionParameterAtTime(leg,track.timingCurve,t));
  let previous=at(0);
  for(let i=1;i<=steps;i++){
    let length=cuts.at(-1);
    for(let j=1;j<=4;j++){
      const point=at((i-1+j/4)/steps);
      length+=distance(previous,point);previous=point;
    }
    cuts.push(length);
  }
  const total=cuts.at(-1);
  if(total<=EPS||cuts.every((value,i)=>Math.abs(value/total-i/steps)<.004))return pieces;
  return cuts.slice(1).flatMap((value,i)=>{
    const part=C.sliceMotionPieces(shape,cuts[i]/total,value/total);
    const lengths=part.map(piece=>C.motionPathLength(C.drawnMotionPath([piece])));
    const length=lengths.reduce((sum,value)=>sum+value,0);
    return part.map((piece,j)=>({...piece,weight:(length?lengths[j]/length:1/part.length)/steps}));
  });
}

/** Move one authored boat position. A gesture always refits from its initial scene. */
function reshapeRoutePosition(scene,trackId,frameId,point,{scale=1,smoothing='standard'}={}){
  if(!validPoint(point)||!Number.isFinite(scale)||scale<=0)throw Error('航线坐标或画布比例无效');
  if(!['light','standard','strong'].includes(smoothing))throw Error('请选择轻、标准或强平滑');
  const next=C.clone(scene),track=findTrackStorage(next,trackId);
  const frames=track?C.orderedFrames(track):[],index=frames.findIndex(frame=>sameId(frame.id,frameId));
  const frame=frames[index];
  if(!frame||frame.routeAnchor===true||frames.length<2)throw Error('请选择可编辑的航线船位');
  const movement=distance(frame.point,point);
  if(!Number.isFinite(movement))throw Error('航线坐标无效');
  if(movement<=EPS)return {scene:next,frameId:frame.id,time:frame.time};
  const segments=C.pathSegments(track);
  let first=index,last=index;
  // Timed-only poses on a stationary hold follow the moved visible pose. Other
  // authored positions, including visible positions in a hold, stay pinned.
  while(frames[first-1]?.routeAnchor===true&&C.motionPathLength(segments[first-1])<=EPS)first--;
  while(frames[last+1]?.routeAnchor===true&&C.motionPathLength(segments[last])<=EPS)last++;
  const moved=new Set(frames.slice(first,last+1));
  const start=Math.max(0,first-1),end=Math.min(segments.length,last+1);
  const legs=segments.slice(start,end),preceding=segments[start-1],following=segments[end];
  const heading=(frame,edge,at)=>frame.headingManual===true?frame.heading:
    edge&&C.motionPathLength(edge)>EPS?C.tangentHeading(edge,at):undefined;
  const fitted=legs.map((leg,i)=>{
    const from=moved.has(leg.start)?point:leg.start.point,to=moved.has(leg.end)?point:leg.end.point;
    const curve=fitRouteStroke(reshapeTrace(leg,from,to,scale),{scale,smoothing,
      startHeading:heading(leg.start,i===0?preceding:null,1),
      endHeading:heading(leg.end,i===legs.length-1?following:null,0)
    });
    return curve.length?curve:[{from,to,control1:{...from},control2:{...to}}];
  });
  if(fitted.length===2){
    const direction=frame.headingManual===true?frame.heading:undefined;
    alignFittedJunction(fitted[0],fitted[1],scale,direction);
  }
  // Determine pacing before mutating endpoint references used by the old path.
  const paced=fitted.map((pieces,i)=>paceReshapedPieces(track,legs[i],pieces));
  const keep=[preceding,following].filter(Boolean);
  const originals=new Map([...keep.map(leg=>leg.start),...legs.map(leg=>leg.start),...moved].map(pose=>[pose,C.clone(pose)]));
  for(const pose of moved){
    pose.point={...point};
    delete pose.drawnSample;
  }
  const routeId=legs.find(leg=>leg.routeId)?.routeId??frame.id;
  for(const [i,leg] of legs.entries()){
    C.setDrawnLeg(leg.start,leg.end,paced[i],{
      id:leg.routeId??routeId,
      interval:leg.start.drawnLeg?.interval??drawnRouteDefaults(next).interval,
      sampling:leg.start.drawnLeg?.sampling??'endpoints'
    });
  }
  C.freezeMotionLegs(track,keep);
  if(frame.headingManual!==true)frame.heading=C.normalFrame(track,frame).heading;
  const fields=['point','heading','drawnSample','drawnLeg','motionToNext','motionControls'];
  for(const [pose,before] of originals)updateRouteSnapshots(next,track.id,before,pose,fields);
  return {scene:next,frameId:frame.id,time:frame.time};
}

function sectionSignature(legs){
  return JSON.stringify(legs.map(leg=>({
    start:leg.start.id.toLowerCase(),end:leg.end.id.toLowerCase(),from:leg.start.time,to:leg.end.time,pieces:sectionPieces(leg)
  })));
}

function visibleSection(track,startFrameId,endFrameId){
  if(!track)return null;
  const frames=C.orderedFrames(track),start=frames.findIndex(frame=>sameId(frame.id,startFrameId));
  const end=frames.findIndex(frame=>sameId(frame.id,endFrameId));
  if(start<0||end<=start||frames[start].routeAnchor===true||frames[end].routeAnchor===true||
    frames.slice(start+1,end).some(frame=>frame.routeAnchor!==true))return null;
  const segments=C.pathSegments(track);
  return {legs:segments.slice(start,end),incoming:segments[start-1],outgoing:segments[end]};
}

function bendChord(section){
  if(!section)return null;
  const from=section.legs[0].start.point,to=section.legs.at(-1).end.point,length=distance(from,to);
  if(!Number.isFinite(length)||length<=EPS)return null;
  const axis={x:(to.x-from.x)/length,y:(to.y-from.y)/length};
  return {from,to,length,axis,normal:{x:-axis.y,y:axis.x},
    midpoint:{x:interpolate(from.x,to.x,.5),y:interpolate(from.y,to.y,.5)}};
}

/** For S bends and loops, choose the crossing nearest the geometric halfway point. */
function chordMidpointOnPath(path,chord){
  const {axis,midpoint}=chord;
  const point=t=>C.pointOnSegment(path,t);
  const projection=p=>(p.x-midpoint.x)*axis.x+(p.y-midpoint.y)*axis.y;
  const middle=point(.5);
  if(Math.abs(projection(middle))<=EPS)return middle;
  const samples=32;
  let previous=projection(point(0)),range=null;
  for(let i=1;i<=samples;i++){
    const value=projection(point(i/samples));
    if(previous*value<=0){
      const from=(i-1)/samples,to=i/samples;
      if(!range||Math.abs((from+to)/2-.5)<Math.abs((range.from+range.to)/2-.5)){
        range={from,to,sign:Math.sign(previous)};
      }
    }
    previous=value;
  }
  if(!range)return middle;
  let {from,to}=range;
  for(let i=0;i<25;i++){
    const at=(from+to)/2;
    if(Math.sign(projection(point(at)))===range.sign)from=at;
    else to=at;
  }
  return point((from+to)/2);
}

/** Find the center handle on the selected geometry, independently of its clock. */
function routeSegmentBendHandle(scene,trackId,startFrameId,endFrameId){
  const section=visibleSection(findTrackStorage(scene,trackId),startFrameId,endFrameId);
  const chord=bendChord(section);
  if(!chord)return null;
  const path=C.drawnMotionPath(section.legs.flatMap(leg=>sectionPieces(leg).map(({weight,...piece})=>piece)));
  const point=chordMidpointOnPath(path,chord);
  const {midpoint,normal,length}=chord;
  const offset=(point.x-midpoint.x)*normal.x+(point.y-midpoint.y)*normal.y;
  return {point,midpoint,normal,offset,length};
}

function endpointBendHeadings(frame,neighbor,neighborEnd){
  const directions=[];
  if(frame.headingManual===true&&Number.isFinite(frame.heading)){
    directions.push({source:'manual',expected:C.normalizeAngle(frame.heading)});
  }
  if(neighbor&&C.motionPathLength(neighbor)>EPS){
    directions.push({source:'adjacent',expected:C.tangentHeading(neighbor,neighborEnd)});
  }
  return directions;
}

/** Fit a single-sided arc with continuous tangent and curvature at its handle. */
function bentSectionPieces(chord,offset,startDirections,endDirections){
  const {from,to,axis,normal,length}=chord;
  const rise=offset/length;
  const side=Math.sign(rise),naturalSlope=4*rise;
  const endSlope=(directions,sign)=>{
    if(!rise)return 0;
    for(const {expected} of directions){
      const angle=expected*Math.PI/180,dx=Math.sin(angle),dy=-Math.cos(angle);
      const along=dx*axis.x+dy*axis.y,across=dx*normal.x+dy*normal.y;
      if(along<=.08)continue;
      const slope=across/along;
      if(Math.abs(slope)<=1e-9)return 0;
      if(sign*slope*side>0)return slope;
    }
    return sign*naturalSlope;
  };
  const part=(a,b,startSlope,endSlope)=>{
    const step=(b.x-a.x)/3;
    return {from:a,to:b,control1:{x:a.x+step,y:a.y+step*startSlope},control2:{x:b.x-step,y:b.y-step*endSlope}};
  };
  const left={x:0,y:0},right={x:1,y:0};
  let startSlope=endSlope(startDirections,1),finishSlope=endSlope(endDirections,-1);
  let pieces;
  if(startSlope===naturalSlope&&finishSlope===-naturalSlope){
    pieces=[part(left,right,startSlope,finishSlope)];
  }else{
    const middle={x:.5,y:rise};
    let middleSlope=-(startSlope+finishSlope)/4;
    // Bound the middle derivative controls so each half contributes at most
    // one overall peak. Relax extreme headings toward the unforced arc.
    const excess=Math.max(side*(startSlope+middleSlope),-side*(finishSlope+middleSlope))-6*Math.abs(rise);
    if(excess>0){
      const margin=2*Math.abs(rise),strength=margin/(margin+excess);
      startSlope=interpolate(naturalSlope,startSlope,strength);
      finishSlope=interpolate(-naturalSlope,finishSlope,strength);
      middleSlope=-(startSlope+finishSlope)/4;
    }
    // Equal-second-derivative condition for the two equal-span cubics.
    pieces=[part(left,middle,startSlope,middleSlope),part(middle,right,middleSlope,finishSlope)];
  }
  const world=p=>({x:from.x+(p.x*axis.x+p.y*normal.x)*length,y:from.y+(p.x*axis.y+p.y*normal.y)*length});
  const result=pieces.map(piece=>({from:world(piece.from),to:world(piece.to),control1:world(piece.control1),control2:world(piece.control2)}));
  result[0].from={...from};
  result.at(-1).to={...to};
  return result;
}

function bendDirectionConflicts(directions,actual,end){
  return directions.filter(({expected})=>Math.abs(C.shortestAngle(actual,expected))>.5)
    .map(direction=>({...direction,actual,end}));
}

const directionAt=heading=>({x:Math.sin(heading*Math.PI/180),y:-Math.cos(heading*Math.PI/180)});
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const cross=(a,b)=>a.x*b.y-a.y*b.x;
const between=(a,b)=>({x:b.x-a.x,y:b.y-a.y});

function pieceCurvature(piece,atEnd){
  const tangent=atEnd?between(piece.control2,piece.to):between(piece.from,piece.control1);
  const middle=between(piece.control1,piece.control2);
  const length=Math.hypot(tangent.x,tangent.y);
  return length>EPS?(atEnd?-2:2)*cross(tangent,middle)/(3*length**3):0;
}

/** A connector advances over its local chord, with both endpoint bearings fixed. */
function bendConnector(from,to,startHeading,endHeading,atStart,curvature){
  const chord=between(from,to),length=Math.hypot(chord.x,chord.y);
  if(length<=EPS)return null;
  const start=directionAt(startHeading),end=directionAt(endHeading);
  const forwardStart=dot(start,chord)/length,forwardEnd=dot(end,chord)/length;
  if(Math.min(forwardStart,forwardEnd)<.12)return null;
  let best=null;
  for(const first of [.1,.19,.29,.4])for(const second of [.1,.19,.29,.4]){
    const reachStart=Math.min(.51,first/forwardStart)*length,reachEnd=Math.min(.51,second/forwardEnd)*length;
    const direction=atStart?start:end;
    const side=atStart?cross(direction,chord)-reachEnd*cross(direction,end):reachStart*cross(direction,start)-cross(direction,chord);
    const matched=side*curvature>EPS?Math.max(.1,Math.min(.51,Math.sqrt(2*side/(3*curvature))/length))*length:null;
    for(const reach of matched===null?[null]:[null,matched]){
      const a=atStart&&reach!==null?reach:reachStart,b=!atStart&&reach!==null?reach:reachEnd;
      if(a*forwardStart+b*forwardEnd>=length*.96)continue;
      const control1={x:from.x+a*start.x,y:from.y+a*start.y},control2={x:to.x-b*end.x,y:to.y-b*end.y};
      const piece={from,to,control1,control2};
      const middle=between(control1,control2),turn=Math.atan2(cross(start,end),dot(start,end));
      let overshoot=0;
      for(const t of [.125,.25,.375,.5,.625,.75,.875]){
        const u=1-t,derivative={x:u*u*a*start.x+2*u*t*middle.x+t*t*b*end.x,
          y:u*u*a*start.y+2*u*t*middle.y+t*t*b*end.y};
        const angle=Math.atan2(cross(start,derivative),dot(start,derivative));
        overshoot=Math.max(overshoot,angle-Math.max(0,turn),Math.min(0,turn)-angle);
      }
      if(overshoot>Math.PI/18)continue;
      const actual=pieceCurvature(piece,!atStart);
      const mismatch=Math.abs(actual-curvature)*length;
      const score=30*overshoot+mismatch+Math.abs(a/length-1/3)+Math.abs(b/length-1/3);
      if(!best||score<best.score)best={piece,score};
    }
  }
  return best;
}

function adjustableNeighbor(leg){
  if(!leg)return null;
  const pieces=sectionPieces(leg).map(({weight,...piece})=>piece);
  const chord=between(leg.start.point,leg.end.point),span=Math.hypot(chord.x,chord.y);
  if(span<=EPS)return null;
  const hasBend=pieces.some(piece=>[piece.from,piece.control1,piece.control2,piece.to]
    .some(point=>Math.abs(cross(chord,between(leg.start.point,point)))/span>1e-5));
  return hasBend?C.drawnMotionPath(pieces):null;
}

/** Modify only a short end of a curved neighbor. The far Bézier pieces are split, not refitted. */
function bendNeighbor(leg,geometry,atStart,heading,curvature,scale){
  const length=C.motionPathLength(geometry),endpoint=atStart?leg.start.point:leg.end.point;
  let best=null;
  for(const size of [.18,.29,.4]){
    const fraction=Math.min(size,150/(scale*length));
    if(fraction<.04)continue;
    const at=atStart?fraction:1-fraction,cut=C.pointOnSegment(geometry,at),cutHeading=C.tangentHeading(geometry,at);
    const connector=atStart?bendConnector(endpoint,cut,heading,cutHeading,true,curvature):
      bendConnector(cut,endpoint,cutHeading,heading,false,curvature);
    if(!connector)continue;
    const score=connector.score+2*fraction;
    if(!best||score<best.score)best={piece:connector.piece,at,score};
  }
  if(!best)return null;
  const kept=atStart?C.sliceMotionPieces(geometry,best.at,1):C.sliceMotionPieces(geometry,0,best.at);
  // Use the exact De Casteljau split point for both sides, including when the
  // arc-length lookup floating point differs from the slice boundary.
  if(atStart)best.piece.to={...kept[0].from};
  else best.piece.from={...kept.at(-1).to};
  return {pieces:atStart?[best.piece,...kept]:[...kept,best.piece],score:best.score};
}

function fitBendJoins(chord,offset,startDirections,endDirections,incoming,outgoing,scale){
  const selected=[startDirections,endDirections];
  const neighbors=[incoming,outgoing];
  const degrees=(pieces,i)=>C.tangentHeading(C.drawnMotionPath([i?pieces.at(-1):pieces[0]]),i);
  const fitted=()=>bentSectionPieces(chord,offset,...selected);
  let pieces=fitted();
  for(let i=0;i<neighbors.length;i++){
    const neighbor=neighbors[i],geometry=adjustableNeighbor(neighbor);
    if(!geometry)continue;
    const directions=i?endDirections:startDirections,manual=directions.find(d=>d.source==='manual');
    const original=directions.find(d=>d.source==='adjacent')?.expected,initial=degrees(pieces,i);
    if(!Number.isFinite(original)||Math.abs(C.shortestAngle(initial,original))<=.5)continue;
    if(manual&&Math.abs(C.shortestAngle(initial,manual.expected))>.5)continue;
    let best=null;
    const candidates=manual?[manual.expected]:[
      ...[0,.25,.5].map(fraction=>C.normalizeAngle(initial+fraction*C.shortestAngle(initial,original))),
      C.normalizeAngle(Math.atan2(chord.axis.x,-chord.axis.y)*180/Math.PI)
    ];
    for(const heading of candidates){
      selected[i]=[{source:'adjacent',expected:heading}];
      const trial=fitted(),actual=degrees(trial,i),curvature=pieceCurvature(i?trial.at(-1):trial[0],!!i);
      if(manual&&Math.abs(C.shortestAngle(actual,manual.expected))>.5)continue;
      const joint=bendNeighbor(neighbor,geometry,!!i,actual,curvature,scale);
      if(!joint)continue;
      const score=joint.score+Math.abs(C.shortestAngle(initial,actual))/55;
      if(!best||score<best.score)best={heading,score};
    }
    selected[i]=best?[{source:'adjacent',expected:best.heading}]:directions;
    pieces=fitted();
  }
  const fittedNeighbors=neighbors.map((leg,i)=>{
    const directions=i?endDirections:startDirections,actual=degrees(pieces,i);
    if(!directions.some(d=>d.source==='adjacent'&&Math.abs(C.shortestAngle(actual,d.expected))>.5)||
      directions.some(d=>d.source==='manual'&&Math.abs(C.shortestAngle(actual,d.expected))>.5))return null;
    const geometry=adjustableNeighbor(leg);
    return geometry?bendNeighbor(leg,geometry,!!i,actual,pieceCurvature(i?pieces.at(-1):pieces[0],!!i),scale):null;
  });
  return {pieces,fittedNeighbors};
}

/** When a timed edit adds a hidden pose, its earlier snapshot needs a continuous leg. */
function preserveBendBeforeHiddenPoses(scene,track,first,last){
  const legs=visibleSection(track,first.id,last.id).legs;
  const byStart=new Map(legs.map((leg,i)=>[leg.start.id.toLowerCase(),i]));
  for(const event of events(scene)){
    const edits=(event.boatEdits??[]).filter(edit=>sameId(edit.trackId,track.id));
    const introduced=new Set(edits.filter(edit=>!edit.before&&edit.after?.routeAnchor===true)
      .map(edit=>edit.frameId.toLowerCase()));
    if(!introduced.size)continue;
    for(const edit of edits){
      const start=byStart.get(edit.frameId.toLowerCase());
      if(!edit.before||start===undefined||introduced.has(edit.frameId.toLowerCase()))continue;
      let end=start;
      while(introduced.has(legs[end].end.id.toLowerCase())&&end<legs.length-1)end++;
      if(end===start)continue;
      const {routeId,start:{drawnLeg}}=legs[start];
      C.setDrawnLeg(edit.before,legs[end].end,legs.slice(start,end+1).flatMap(C.timedMotionPieces),
        {id:routeId,interval:drawnLeg.interval,sampling:drawnLeg.sampling});
    }
  }
}

/** Rebuild the selected span and, where possible, connect its adjacent curved ends. */
function setRouteSegmentBend(scene,trackId,startFrameId,endFrameId,{offset,scale=1}={}){
  if(!Number.isFinite(offset)||!Number.isFinite(scale)||scale<=0)throw Error('弧度或画布比例无效');
  const next=C.clone(scene),track=findTrackStorage(next,trackId);
  const section=visibleSection(track,startFrameId,endFrameId);
  const chord=bendChord(section);
  if(!section)throw Error('请选择两个相邻展示船位之间的航段');
  if(!chord)throw Error('两端船位重合，无法调整弧度');
  const {legs,incoming,outgoing}=section;
  const first=legs[0].start,last=legs.at(-1).end;
  const startDirections=endpointBendHeadings(first,incoming,1),endDirections=endpointBendHeadings(last,outgoing,0);
  offset=Math.abs(offset)*scale<=1?0:Math.sign(offset)*Math.min(chord.length/2,Math.abs(offset));
  const {pieces,fittedNeighbors}=fitBendJoins(chord,offset,startDirections,endDirections,incoming,outgoing,scale);
  const path=C.drawnMotionPath(pieces),endpoints=['start','end'];
  const conflicts=[...bendDirectionConflicts(startDirections,C.tangentHeading(path,0),'start'),
    ...bendDirectionConflicts(endDirections,C.tangentHeading(path,1),'end')]
    .filter(conflict=>conflict.source==='manual'||!fittedNeighbors[endpoints.indexOf(conflict.end)]);
  const lengths=legs.map(C.motionPathLength),total=lengths.reduce((sum,length)=>sum+length,0);
  let distanceAlong=0;
  const fitted=legs.map((leg,i)=>{
    const from=distanceAlong/total;
    distanceAlong+=lengths[i];
    const to=i===legs.length-1?1:distanceAlong/total;
    return paceReshapedPieces(track,leg,C.sliceMotionPieces(path,from,to));
  });
  const keep=[incoming,outgoing].filter(Boolean);
  const adjacent=[incoming,outgoing].map((leg,i)=>fittedNeighbors[i]&&{leg,index:i,
    pieces:paceReshapedPieces(track,leg,fittedNeighbors[i].pieces)}).filter(Boolean);
  const originals=new Map([...keep.map(leg=>leg.start),...legs.map(leg=>leg.start),last].map(frame=>[frame,C.clone(frame)]));
  const routeId=legs.find(leg=>leg.routeId)?.routeId??first.id;
  for(const [i,leg] of legs.entries()){
    if(i)leg.start.point={...fitted[i][0].from};
    const {start,end}=leg;
    C.setDrawnLeg(start,end,fitted[i],{
      id:leg.routeId??routeId,
      interval:start.drawnLeg?.interval??drawnRouteDefaults(next).interval,
      sampling:start.drawnLeg?.sampling??'endpoints'
    });
    if(start.headingManual!==true&&lengths[i]>EPS)start.heading=C.tangentHeading(C.drawnMotionPath(fitted[i]),0);
    delete start.drawnSample;
  }
  if(last.headingManual!==true)last.heading=C.tangentHeading(path,1);
  delete last.drawnSample;
  for(const {leg:{start,end,routeId:neighborId},pieces} of adjacent){
    C.setDrawnLeg(start,end,pieces,{id:neighborId??start.id,
      interval:start.drawnLeg?.interval??drawnRouteDefaults(next).interval,
      sampling:start.drawnLeg?.sampling??'endpoints'});
  }
  C.freezeMotionLegs(track,keep.filter(leg=>!adjacent.some(change=>change.leg===leg)));
  const fields=['point','heading','drawnSample','drawnLeg','motionToNext','motionControls'];
  for(const [frame,before] of originals)updateRouteSnapshots(next,trackId,before,frame,fields);
  if(legs.length>1)preserveBendBeforeHiddenPoses(next,track,first,last);
  const visible=C.orderedFrames(track).filter(frame=>frame.routeAnchor!==true);
  const index=visible.indexOf(first),neighborSpans=[[visible[index-1],first],[last,visible[index+2]]];
  for(const {index:side} of adjacent){
    const [a,b]=neighborSpans[side];
    if(a&&b)preserveBendBeforeHiddenPoses(next,track,a,b);
  }
  const key=[track.id,first.id,last.id].map(id=>id.toLowerCase()).join('/');
  if(next.studio.segmentSmoothing)delete next.studio.segmentSmoothing[key];
  return {scene:next,offset,conflicts,joined:adjacent.map(({index})=>({end:endpoints[index]}))};
}

function segmentSmoothing(scene,trackId,startFrameId,endFrameId){
  const track=findTrackStorage(scene,trackId);
  if(!track)return null;
  const frames=C.orderedFrames(track),start=frames.findIndex(frame=>sameId(frame.id,startFrameId)),end=frames.findIndex(frame=>sameId(frame.id,endFrameId));

function normalizeRuleEdition(value){

const ruleEditionLabel=version=>normalizeRuleEdition(version).replace('-','–')||'版次未核对';

/** A historical snapshot remains readable, but only a compatible current rule is active. */
function ruleReferenceIssue(scene,rule){
 if(!isOfficialRule(rule))return '';
 if(!normalizeRuleEdition(rule.version))return '条文版次待核对';
 if(!isCurrentLibraryRule(rule))return '本条不属于现行官方规则';
 if(normalizeRuleEdition(scene?.studio?.ruleEdition)!==RULE_CATALOG_VERSION)return '与本案记录的规则版次不符';

}

/** Accept common typed numbers; never turn 10 into a substring query for 100. */
function normalizeRuleNumber(value){
 const n=normalized(value).replace(/^(?:rrs\s*|rule\s*|第\s*)/i,'').replace(/\s*条\s*(?:第\s*)?(\d+)\s*款$/,'.$1').replace(/\s*条$/,'').replace(/\s+/g,'');
 if(!/^[a-z]{0,3}\d+(?:\.\d+)*(?:\([a-z0-9]+\))*$/.test(n))return '';

}
function numericRelation(number,query){

 if(query.startsWith(n+'.')||query.startsWith(n+'('))return 850;
 return 0;
}

/** Search title, number, user-supplied full text and contextual search vocabulary. */
function searchRuleCatalog(userRules=[],query='',options={}){
 const local=(Array.isArray(userRules)?userRules:[]).filter(row=>row&&typeof row==='object'&&isWithinScope(row,options)&&isCurrentLibraryRule(row));
 const supplied=new Set(local.filter(row=>row.type==='official'&&String(row.text??'').trim()).map(ruleIdentity));
 const rows=[...local,...catalogue.filter(row=>!supplied.has(ruleIdentity(row)))];
 const indexByIdentity=new Map(catalogue.map(row=>[ruleIdentity(row),row]));
 const rankByIdentity=new Map(catalogue.map((row,index)=>[ruleIdentity(row),index]));
 const groupOrder=new Map();
 rows.forEach((row,index)=>{const key=row.type+'|'+ruleIdentity(row);if(!groupOrder.has(key))groupOrder.set(key,index);});
 const q=normalized(query),number=normalizeRuleNumber(q),terms=q.split(' ').filter(Boolean);

  const matchingIndex=row.type==='official'||row.type==='reference'?indexByIdentity.get(ruleIdentity(row)):null;
  let score=0;
  if(number)score=numericRelation(row.number,number);
  else if(q){
   const title=normalized(row.title),english=normalized(row.officialTitle);
   const keywords=normalized([row.keywords,matchingIndex?.title,matchingIndex?.keywords].flat().join(' '));
   const full=normalized([row.number,row.title,row.officialTitle,row.text,row.translation,row.summary,row.version,row.revision,keywords].join(' '));
   if(terms.every(term=>full.includes(term)))score=title===q||english===q?800:title.includes(q)||english.includes(q)?650:keywords.includes(q)?550:350;
  }else score=100;
  if(score&&row.competitionId&&String(row.competitionId)===String(options.competitionId))score+=20;
  if(score&&!row.builtin)score+=5;
  const rank=q?0:rankByIdentity.get(ruleIdentity(row))??catalogue.length;
  return{row,index,score,rank,group:groupOrder.get(row.type+'|'+ruleIdentity(row))};
 }).filter(item=>item.score>0).sort((a,b)=>a.rank-b.rank||b.score-a.score||a.group-b.group||String(b.row.revision||'').localeCompare(String(a.row.revision||''))||Number(!!b.row.preferred)-Number(!!a.row.preferred)||a.index-b.index);
 return scored.map(({row})=>{const value=copy(row);value.originalAvailable=String(value.text??'').trim().length>0;return value;});
}

function tsvRows(text){
 const rows=[];let row=[],cell='',quoted=false,closed=false;
 const endCell=()=>{row.push(cell);cell='';closed=false;};
 const endRow=()=>{endCell();if(row.some(v=>v!==''))rows.push(row);row=[];if(rows.length>RULE_IMPORT_MAX_COUNT+1)throw Error('一次最多导入1000条条例');};

  const char=text[i];
  if(quoted){if(char==='"'){if(text[i+1]==='"'){cell+='"';i++;}else{quoted=false;closed=true;}}else cell+=char;continue;}
  if(char==='\t'){endCell();continue;}
  if(char==='\n'||char==='\r'){if(char==='\r'&&text[i+1]==='\n')i++;endRow();continue;}
  if(char==='"'&&!cell&&!closed){quoted=true;continue;}
  if(closed)throw Error('表格引号后只能接制表符或换行');
  if(char==='"')throw Error('含引号的表格内容须用双引号包住');
  cell+=char;
 }

}

 const delta={x:screen.x-start.x,y:screen.y-start.y};
 const input=gesture.input??=beginBendDrag(handle,transform,start,delta);
 const offset=bendOffsetFromDrag(input,delta);
 const requested=Math.abs(offset)*transform.scale<3?0:offset;
 if(requested===gesture.lastOffset)return;
 try{
  previewSegmentBend(requested,transform.scale);
  gesture.lastOffset=requested;
  gesture.error=null;
 }catch(error){gesture.error=error.message;}
}

function activeDrawnRoute(){

function handleDrawingAction(name){
 const a=current();
 switch(name){
  case 'retry-project-save':persist();return true;
  case 'file-menu':
  case 'imports':$('file-input').click();return true;
  case 'import-help':showImportHelp();return true;
  case 'copy-import-prompt':libraryPanel?.copyRuleAIPrompt();return true;
  case 'download-import-template':libraryPanel?.downloadRuleTemplate();return true;
  case 'export-library':libraryPanel?.exportBackup();return true;
  case 'export-rules-package':
   if($('export-rule-package'))libraryPanel?.exportRulePackage($('export-rule-package').value);
   return true;
  case 'quick-add':showQuickBoats();return true;
  case 'route-drag':
   closeDialog();closeEnvironmentPopover();
   routeMethod='drag';try{localStorage.setItem('sailscenario-route-method','drag');}catch{}
   mode=null;$('pan').classList.remove('on');$('rotate-view').classList.remove('on');refresh();wakePresentation();return true;
  case 'route-start':{
   routeMethod='stroke';try{localStorage.setItem('sailscenario-route-method','stroke');}catch{}
   if(a.boat&&a.boat.visible!==false){beginRoute(a.boat.id);return true;}
   if(!effectiveScene().tracks.some(boat=>boat.visible!==false)){toast('先添加一艘船，再一笔画航线');showQuickBoats();return true;}
   $('pan').classList.remove('on');$('rotate-view').classList.remove('on');
   document.querySelector('.view-menu').open=false;
   startPlacement('route-pick');wakePresentation();
   return true;
  }
  case 'route-draw':{
   if(!a.boat)return true;
   const last=DR.routeOrigin(scene,a.boat.id);
   if(last&&a.item.id!==last.id&&time<last.time-.01){
    showDialog('从哪里开始画',`<button class="wide primary" data-action="route-append">从最后船位继续</button>
    <button class="wide" data-action="route-replace">从所选船位重画后续</button>`);
   }else beginRoute(a.boat.id);
   return true;
  }
  case 'route-append':if(a.boat)beginRoute(a.boat.id);return true;
  case 'route-replace':{
   if(a.boat)showDialog('重画这艘船的后续航线',`<p>所选船位之后的航线将替换，已有调帆、旗帜和环境时刻会保留。画完可以撤销。</p><button class="wide primary" data-action="route-replace-confirm">开始重画</button>`);
   return true;
  }
  case 'route-replace-confirm':if(a.boat)beginRoute(a.boat.id,a.item.id);return true;
  case 'segment-straighten':{
   if(segmentBendHandle()){
    try{previewSegmentBend(0,metrics().scale);}
    catch(error){toast(error.message);}
    inspector();renderSegmentActions();draw();
   }
   return true;
  }
  case 'segment-apply':{
   const preview=activeSegmentPreview();
   if(preview){segmentPreview=null;change(()=>{scene=preview.next;},true);toast('已应用航段线形 · 可撤销');}
   return true;
  }
  case 'segment-cancel':segmentPreview=null;refresh();return true;
  case 'route-sync':
   if(['segment','route'].includes(selection?.kind))beginRouteSync(selection.trackId);
   return true;
  case 'route-sync-apply':{
   const result=activeRouteSync()?.result;
   if(result){
    const history=timedHistory();
    change(()=>{scene=result.scene;time=result.meetingTime??time;mode=null;selection=null;},true,history);
    toast(result.meetingTime===null?'已应用同速 · 可撤销':'已应用同速交会 · 可撤销');
   }
   return true;
  }
  case 'route-select-full':if(a.boat)select({kind:'route',id:a.boat.id,trackId:a.boat.id},true);return true;
  case 'route-settings':showRouteSettings();return true;
  case 'route-add-position':
   if(a.boat){
    $('pan').classList.remove('on');$('rotate-view').classList.remove('on');
    const span=selection?.kind==='segment'?{startFrameId:selection.id,endFrameId:selection.endId}:{};
    startPlacement('route-add-position',{trackId:a.boat.id,...span});
   }
   return true;
  case 'route-apply':{
   const draft=mode?.type==='draw-route'?mode:null,route=draft??activeDrawnRoute();
   if(!route)return true;
   const sampling=$('route-sampling').value,interval=sampling==='interval'?$('route-interval').valueAsNumber:route.interval;
   const settings={sampling,interval,duration:$('route-duration').valueAsNumber,count:$('route-count').valueAsNumber};
   const smoothing=$('route-smoothing').value;
   if(draft){
    try{
     const start=DR.routeOrigin(scene,draft.trackId,{replaceFromId:draft.replaceFromId})?.time??0;
     DR.validateRouteSettings({start,...settings});
     Object.assign(draft,settings,{smoothing});
     closeDialog();refresh();
    }catch(error){toast(error.message);}
    return true;
   }
   change(()=>{
    const result=DR.resampleDrawnRoute(scene,route.trackId,route.id,{...settings,...(smoothing&&smoothing!==$('route-smoothing').dataset.original?{smoothing,scale:metrics().scale}:{})});
    scene=result.scene;time=Math.min(time,scene.duration);closeDialog();
   },true,timedHistory());
   return true;
  }
  case 'sail-edit':{
   if(!a.boat||!K.boatKind(a.boatmeta.kind).hasMain)return true;
   sizeTrack=null;
   if(a.boatmeta.sailAnglesLocked){setPane('properties');return true;}
   if(C.sailState(effectiveScene(),a.boat,a.item,time).mode!=='manual')change(()=>{prepareBoatEdit();enterManual();});else refresh();
   return true;
  }
  case 'sail-lock':
  if(a.boat)changeDocument(d=>{d.studio.boats[a.boat.id].sailAnglesLocked=!a.boatmeta.sailAnglesLocked;});
  return true;
 case 'resize-boat':{
   if(!a.boat||!K.isAdjustableBoatKind(a.boatmeta.kind))return true;
   if(!M.metersPerUnit(effectiveScene())){toast('请先标定画布的米制比例');return true;}
   sizeTrack=sizeTrack===a.boat.id?null:a.boat.id;
   if(sizeTrack)toast('拖船艏或舷侧分别调整，船上双指缩放可等比调节');
   refresh();return true;
  }
  default:return false;
 }
}

function setEnvironmentLayout(key,value){

  const t=metrics();
  const visible=Object.entries(before).filter(([,h])=>h.screen.x>=h.screenWidth/2&&h.screen.x<=t.width-h.screenWidth/2&&
    h.screen.y>=h.screenHeight/2&&h.screen.y<=t.height-h.screenHeight/2);
  // An overflowing dock contains off-screen cards. Give all of them tidy
  // free-mode positions instead of preserving just half of the row.
  if(visible.length===Object.keys(before).length){
   layout.positions=Object.fromEntries(visible.map(([id,h])=>[id,{x:h.screen.x/t.width,y:h.screen.y/t.height}]));
  }
 }
 view.environmentLayout=layout;
 delete view.environmentDockOffset;
 persist();refresh();
}

function resetEnvironmentLayout(){
 closeEnvironmentPopover();
 const old=view.environmentLayout;
 const mode=old?.mode||(Object.values(view.environmentPins||{}).some(Boolean)?'dock':'world');
 view.environmentLayout={mode,edge:old?.edge||'top',worldPositions:null};
 delete view.environmentDockOffset;
 persist();refresh();
}

function closeEnvironmentPopover(){
 if(!environmentPopover)return;
 environmentPopover=null;
 const panel=$('environment-controls');panel.hidden=true;panel.innerHTML='';
}

function renderEnvironmentPopover(){
 if(!environmentPopover)return;
 const panel=$('environment-controls'),d=effectiveScene(),e=d.studio.environment;
 const {key,gustAreaId}=environmentPopover;
 const gust=gustAreaId&&d.areas.find(a=>a.id===gustAreaId&&a.visible!==false);
 if(gustAreaId&&!gust){closeEnvironmentPopover();return;}
 const name=gust?gust.name||'阵风':({wind:'基础风',shift:'风摆',wave:'浪',current:'流'}[key]);
 let content;
 if(gust){
  const gusts=d.areas.filter(a=>a.visible!==false&&G.areaPurpose(A.areaMeta(d,a))==='gust');
  const choices=gusts.length>1?`<label class="field"><span>阵风区</span><select data-active-gust>${gusts.map(a=>`<option value="${esc(a.id)}" ${a.id===gust.id?'selected':''}>${esc(a.name||'阵风')}</option>`).join('')}</select></label>`:'';
  content=choices+environmentRange('gustSpeed:'+gust.id,'阵风风速',C.areaWindAt(d,gust,time).speedKnots,0,230,'kn');
 }else if(key==='wind')content=environmentRange('wind.speedKnots','风速',d.windField.speedKnots,0,150,'kn');
 else if(key==='shift')content=shiftRanges(d);
 else if(key==='wave')content=waveRanges(e);
 else content=environmentRange('env.currentSpeed','流速',e.currentSpeed,0,30,'kn');
 panel.innerHTML=`<div class="environment-controls-heading"><strong>${esc(name)}</strong><button type="button" data-action="environment-close" aria-label="关闭环境参数">×</button></div>${content}`;
 panel.hidden=false;
 updateEnvironmentReadouts(d,metrics());
}

function focusGust(id){
 const d=effectiveScene(),area=d.areas.find(a=>a.id===id&&a.visible!==false);
 if(area&&G.areaPurpose(A.areaMeta(d,area))==='gust')view.activeGustId=id;
}

function selectEnvironmentGust(id){
 if(!environmentPopover)return;
 finishPending();
 focusGust(id);
 environmentPopover.gustAreaId=id;
 persist();renderEnvironmentPopover();draw();
}

function placeEnvironmentPopover(t,scene){
 if(!environmentPopover)return;
 const panel=$('environment-controls'),card=R.environmentHandles(scene,t,undefined,undefined,time)[environmentPopover.key];
 if(!card){closeEnvironmentPopover();return;}
 const margin=8,gap=6;
 const top=card.screen.y-card.screenHeight/2,bottom=card.screen.y+card.screenHeight/2;
 const width=panel.offsetWidth,height=panel.offsetHeight;
 panel.style.left=Math.max(margin,Math.min(t.width-width-margin,card.screen.x-width/2))+'px';
 const y=bottom+height+gap<t.height?bottom+gap:top-height-gap;
 panel.style.top=Math.max(margin,Math.min(t.height-height-margin,y))+'px';
}

function updateEnvironmentReadouts(d,t){
 placeEnvironmentPopover(t,d);
 const e=d.studio.environment,wind=C.windAt(d,time);
 const area=selection?.kind==='area'?d.areas.find(a=>a.id===selection.id):null;
 const local=area&&G.isWindArea(A.areaMeta(d,area))?C.areaWindAt(d,area,time):null;
 const bearings={wind:windName(d.windField.direction),shift:windName(wind.direction),wave:G.displayBearing(e.waveFrom)+'°',current:G.displayBearing(e.currentTo)+'°',area:local?windName(local.direction):null};
 for(const el of document.querySelectorAll('[data-environment-bearing]')){
  const value=bearings[el.dataset.environmentBearing];
  if(value!=null&&el.textContent!==value)el.textContent=value;
 }
 const values={'wind.speedKnots':d.windField.speedKnots,'env.shiftSpeedKnots':wind.speedKnots,'env.waveHeight':e.waveHeight,
  'env.wavePeriod':e.wavePeriod,'env.waveSpeedMS':e.waveSpeedMS,'env.currentSpeed':e.currentSpeed,'meta.windSpeed':local?.speedKnots};
 if(environmentPopover?.gustAreaId){
  const gust=d.areas.find(a=>a.id===environmentPopover.gustAreaId);
  if(gust)values['gustSpeed:'+gust.id]=C.areaWindAt(d,gust,time).speedKnots;
 }
 for(const el of document.querySelectorAll('[data-environment-value]')){
  const value=values[el.dataset.environmentValue];
  if(!Number.isFinite(value))continue;
  const text=value.toFixed(1)+' '+el.dataset.unit;
  if(el.textContent!==text)el.textContent=text;
  const slider=el.nextElementSibling;
  if(slider?.type==='range'&&document.activeElement!==slider&&Number(slider.value)!==value){
   if(value>Number(slider.max))slider.max=value;
   if(value<Number(slider.min))slider.min=value;
   slider.value=Number(value.toFixed(1));
  }
 }
}

function bearingFrom(origin,p){
 return C.normalizeAngle(Math.atan2(p.x-origin.x,-(p.y-origin.y))*180/Math.PI);
}

function beginEnvironmentGesture(p,t,event,screen){
 const d=effectiveScene(),hit=R.environmentHit(d,p,t,time);
 if(!hit)return false;
 const h=R.environmentHandles(d,t,undefined,undefined,time)[hit.id];
 const gustArrow=hit.part==='gust-arrow';
 const anchor=gustArrow?h.gustArrowAnchor:h.arrowAnchor;
 const tip=gustArrow?h.gustArrowTip:h.arrowTip;
 const turn=hit.part==='arrow'||gustArrow;
 const rail=R.environmentDockMetrics(d,t);
 const difference=turn?C.shortestAngle(bearingFrom(anchor,p),bearingFrom(anchor,tip)):0;
 activeEnvironmentId=hit.id;
 selection={kind:'environment',id:hit.id};lassoTargets=[];
 renderLassoActions();$('selection-summary').textContent=selectionDescription();
 closeEnvironmentPopover();
 drag={type:'environment-card',id:event.pointerId,start:screen,moved:false,hit,h,transform:t,rail,origin:p,anchor,difference,
  environmentViewBefore:{layout:view.environmentLayout,offset:view.environmentDockOffset},
  before:turn?JSON.stringify(scene):null};
 refresh();event.preventDefault();
 return true;
}

function restoreEnvironmentPlacement({layout,offset}){
 if(layout===undefined)delete view.environmentLayout;
 else view.environmentLayout=layout;
 if(offset===undefined)delete view.environmentDockOffset;
 else view.environmentDockOffset=offset;
}

function moveEnvironmentGesture(screen){
 if(!drag.moved)return;
 const {hit,h,transform:t,rail,origin,anchor,difference,start}=drag;
 const dx=screen.x-start.x,dy=screen.y-start.y;
 if(hit.part==='arrow'||hit.part==='gust-arrow'){
  try{
   const p=R.worldAt(screen.x,screen.y,t);
   if(Math.hypot(p.x-anchor.x,p.y-anchor.y)*t.scale<5)return;
   const bearing=C.normalizeAngle(Math.round(bearingFrom(anchor,p)+difference+(hit.id==='current'?0:180)));
   ensureAuto();setEnvironmentDirection(hit,bearing);drag.error=null;
  }catch(error){drag.error=error.message;}
 }else if(h.placement==='dock'){
  if(rail.maxOffset<=0)return;
  const delta=rail.axis==='x'?dx:dy;
  view.environmentDockOffset=Math.max(0,Math.min(rail.maxOffset,rail.offset-delta));
 }else{
  const layout={...view.environmentLayout};
  if(h.placement==='free'){
   const v=h.viewport;
   const x=Math.max(v.left+h.screenWidth/2,Math.min(v.right-h.screenWidth/2,h.screen.x+dx));
   const y=Math.max(v.top+h.screenHeight/2,Math.min(v.bottom-h.screenHeight/2,h.screen.y+dy));
   layout.positions={...layout.positions,[hit.id]:{x:x/t.width,y:y/t.height}};
  }else{
   const p=R.worldAt(screen.x,screen.y,t);
   const positions=layout.worldPositions;
   const fallback=positions===null?Object.fromEntries(['wind','shift','wave','current'].map(key=>[key,null])):positions;
   layout.worldPositions={...fallback,[hit.id]:{x:h.x+p.x-origin.x,y:h.y+p.y-origin.y}};
  }
  view.environmentLayout=layout;
 }
 draw();
}

function setEnvironmentDirection(hit,direction){
 const e=scene.studio.environment;
 if(hit.part==='gust-arrow'){
  const item=scene.areas.find(a=>a.id===hit.gustAreaId);
  if(!item)return;
  const meta=scene.studio.areas[item.id]??=A.areaMeta(scene,item);
  if(!meta.locked)setAreaDirection({item,meta},direction);
 }else if(hit.id==='wind'){
  scene.windField.direction=direction;scene.windDirection=direction;
 }else if(hit.id==='shift'){
  e.shiftDirection=direction;e.shiftMode='manual';
 }else if(hit.id==='wave')e.waveFrom=direction;
 else e.currentTo=direction;
}

function finishEnvironmentGesture(done,cancel){
 const {hit,moved,environmentViewBefore}=done;
 if(cancel||done.error){
  if(editSession)cancelKeyframe();
  restoreEnvironmentPlacement(environmentViewBefore);
  if(done.error)toast(done.error);
  refresh();return;
 }
 if(editSession&&done.before){record(done.before);return;}
 if(moved){
  // The edge scroll offset is transient, but free and world positions are saved.
  if(done.h.placement!=='dock')persist();
  draw();return;
 }
 if(hit.part==='reading'||hit.part==='gust'||hit.part==='gust-arrow'){
  environmentPopover={key:hit.id,gustAreaId:hit.part.startsWith('gust')?hit.gustAreaId:null};
  renderEnvironmentPopover();
 }
 draw();
}

function handleSelectionAction(name){
 if(name==='lasso'){
  if(mode?.type==='lasso'){mode=null;lassoTargets=[];refresh();return true;}
  selection=null;sizeTrack=null;activeEnvironmentId=null;
  $('pan').classList.remove('on');$('rotate-view').classList.remove('on');
  startPlacement('lasso');
  return true;
 }
 if(name==='delete-selected'){
  removeSelected();
  return true;
 }
 return false;
}

function selectionDescription(){
 if(lassoTargets.length){
  const counts=new Map(),names={boat:'艘整船',frame:'船位',route:'航线',area:'区域',mark:'航标',line:'辅助线',label:'文字',environment:'标志',startFinish:'起终点线'};
  for(const target of lassoTargets)counts.set(target.kind,(counts.get(target.kind)||0)+1);
  return '已选 '+lassoTargets.length+' 项 · '+[...counts].map(([kind,count])=>count+' '+(names[kind]||'对象')).join('、');
 }
 if(!selection)return '';
 if(selection.kind==='moment'){
  const n=AF.frameTimes(scene).findIndex(t=>Math.abs(t-selection.time)<1e-6)+1;
  return selection.time===0?'初始画面 · 0 秒':`第 ${n} 幕 · ${Number(selection.time.toFixed(2))} 秒 · 全部船位与参数变化`;
 }
 if(selection.kind==='environment')return {wind:'风向标志',shift:'风摆标志',wave:'浪标志',current:'流标志'}[selection.id]||'环境标志';
 const a=current();
 if(selection.kind==='route')return (a.boat?.name||'船')+' · 整条航线';
 if(selection.kind==='segment'){
  const frames=C.orderedFrames(a.boat).filter(SE.isEditableFrame);
  return `${a.boat.name} · 船位 ${frames.findIndex(f=>f.id===selection.id)+1} → ${frames.findIndex(f=>f.id===selection.endId)+1}`;
 }
 if(selection.kind==='frame'){
  const name=[a.boat?.name,a.boat?.sailNumber?'#'+a.boat.sailNumber:''].filter(Boolean).join(' ')||'船';
  if(selection.scope==='boat')return name+' · 整艘船';
  const n=a.boat?C.orderedFrames(a.boat).filter(SE.isEditableFrame).findIndex(f=>f.id===selection.id)+1:0;
  if(selection.atTime)return `${name} · 当前航行位置 · ${Number(time.toFixed(2))} 秒`;
  return `${name} · 船位 ${n||'·'} · ${Number(time.toFixed(2))} 秒`;
 }
 return (a.item?.name||a.item?.text||'')+' · '+({area:{wind:'风区',gust:'阵风',obstruction:'障碍区'}[G.areaPurpose(a.meta)],line:'辅助线',mark:'航标',label:'标注'}[selection.kind]||'对象');
}

function renderLassoActions(){
 const active=mode?.type==='lasso';
 for(const button of document.querySelectorAll('[data-action="lasso"]')){
  button.classList.toggle('on',active);button.setAttribute('aria-pressed',String(active));
 }
 const controls=$('lasso-actions');
 controls.hidden=!!activeRouteSync()||!lassoTargets.length&&(!selection||selection.kind==='segment');
 if(!controls.hidden){
  $('lasso-count').textContent=selectionDescription();$('lasso-count').title=$('lasso-count').textContent;
  $('lasso-delete').disabled=selection?.kind==='moment'&&selection.time===0||!!(selection?.atTime&&!selection.scope);
 }
}

function deleteCanvasTargets(targets,clicked=null){
 if(!targets.length)return;
 finishPending();
 try{
  const result=SE.deleteSelection(scene,targets,{time});
  if(!result.deletedCount){toast('请选择可删除的船位或素材');return;}
  const deleted=result.deletedTargets[0];
  let nextTime=time;
  if(clicked?.kind==='frame'&&deleted.kind==='frame'&&deleted.id===clicked.id){
   const frame=E.findTrackStorage(scene,deleted.trackId)?.keyframes.find(f=>f.id===deleted.id);
   const boat=E.findTrackStorage(result.scene,deleted.trackId);
   if(boat&&frame&&Math.abs(frame.time-time)<1e-6){
    const frames=C.orderedFrames(boat).filter(SE.isEditableFrame);
    const visible=f=>{
     const past=R.boatSceneAt(result.scene,result.scene,f.time).tracks.find(candidate=>candidate.id===boat.id);
     return past&&past.visible!==false&&past.keyframes.some(candidate=>candidate.id===f.id&&SE.isEditableFrame(candidate));
    };
    const prior=frames.findLast(f=>f.time<time-1e-6&&visible(f));
    const next=prior??frames.find(f=>f.time>time+1e-6&&visible(f));
    if(next)nextTime=next.time;
   }
  }
  closeEnvironmentPopover();
  const history=timedHistory();
  change(()=>{
   scene=result.scene;time=nextTime;selection=null;lassoTargets=[];
   if(mode?.type==='lasso')mode.points=[];
  },true,history);
  toast('已删除 '+result.deletedCount+' 项 · 可撤销');
  if(quickPane&&$('dialog').open)renderQuickPane();
 }catch(error){toast(error.message);}
}

function lassoCandidates(){
 const d=effectiveScene(),t=metrics(),anchors=[],shapes=[];
 const anchor=(target,p)=>anchors.push({target,point:R.screenAt(p,t)});
 const shape=(target,points,closed)=>shapes.push({target,points:points.map(p=>R.screenAt(p,t)),closed});
 for(const boat of d.tracks){
  if(boat.visible===false)continue;
  const frames=C.orderedFrames(boat).filter(SE.isEditableFrame);
  if(SE.isSinglePositionBoat(boat)||!frames.length){
   const pose=C.poseAt(boat,time);
   if(pose)anchor({kind:'boat',id:boat.id},pose.point);
   continue;
  }
  for(const frame of frames){
   const past=R.boatSceneAt(scene,d,frame.time),track=past.tracks.find(b=>b.id===boat.id);
   if(track&&track.visible!==false)anchor({kind:'frame',trackId:boat.id,id:frame.id},frame.point);
  }
 }
 for(const [kind,list] of [['mark',d.marks],['label',d.labels]]){
  for(const item of list)if(item.visible!==false)anchor({kind,id:item.id},item.point);
 }
 for(const item of d.lines)if(item.visible!==false&&item.points?.length)shape({kind:'line',id:item.id},item.points,false);
 for(const item of d.areas)if(item.visible!==false&&item.points?.length)shape({kind:'area',id:item.id},item.points,true);
 shapes.push(...R.routeSelectionShapes(d,t));
 if(d.startFinishLine)shape({kind:'startFinish',id:'start-finish'},[d.startFinishLine.start,d.startFinishLine.end],false);
 for(const h of Object.values(R.environmentHandles(d,t,undefined,undefined,time))){
  const v=h.viewport;
  if(h.placement!=='dock'||(h.screen.x>=v.left&&h.screen.x<=v.right&&h.screen.y>=v.top&&h.screen.y<=v.bottom)){
   anchors.push({target:{kind:'environment',id:h.key},point:h.screen});
  }
 }
 return {anchors,shapes};
}

function finishLasso(done,event,cancel){
 if(mode?.type!=='lasso')return;
 if(cancel||!done.moved){mode.points=[];lassoTargets=[];refresh();return;}
 const p=canvasPoint(event),t=metrics();
 L.appendStroke(mode.points,R.worldAt(p.x,p.y,t),done.scale);
 const points=L.simplifyStroke(mode.points,1/Math.max(.01,done.scale)).map(p=>R.screenAt(p,t));
 const {anchors,shapes}=lassoCandidates();
 const selected=points.length>=3?SE.selectInLasso(points,anchors,shapes):[];
 const routeIds=new Set(selected.filter(s=>s.kind==='route').map(s=>s.trackId));
 lassoTargets=selected.filter(s=>s.kind==='boat'?!routeIds.has(s.id):s.kind!=='frame'||!routeIds.has(s.trackId));
 mode.points=[];
 renderLassoActions();draw();
 if(!lassoTargets.length)toast('圈内没有选中对象，可重新画圈');
}

function drawLasso(rect,dpr){
 if(mode?.type!=='lasso')return;
 const t=metrics(),d=effectiveScene();
 ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.strokeStyle='#087f8c';ctx.fillStyle='#087f8c12';ctx.lineWidth=2;ctx.lineJoin='round';
 const polygon=points=>{
  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 };
 if(mode.points?.length){
  polygon(mode.points.map(p=>R.screenAt(p,t)));
  if(mode.points.length>2){ctx.closePath();ctx.fill();}
  ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
 }
 const handles=R.environmentHandles(d,t,undefined,undefined,time);
 for(const target of lassoTargets){
  let point,radius=18;
  if(target.kind==='frame'||target.kind==='boat'){
   const boat=d.tracks.find(b=>b.id===(target.trackId||target.id));
   const frame=boat&&(target.kind==='boat'?C.poseAt(boat,time):boat.keyframes.find(f=>f.id===target.id));
   if(!frame)continue;
   point=frame.point;
   const meta=d.studio.boats[boat.id],g=R.boatGeometry(meta?.kind,meta),scale=M.boatScale(d,meta,g);
   radius=Math.max(18,Math.min(90,Math.max(scale.length,scale.width)*t.scale/2+8));
  }else if(target.kind==='route'){
   const boat=d.tracks.find(b=>b.id===target.trackId);
   if(boat){polygon(R.routeGeometry(d,boat,t).map(p=>R.screenAt(p,t)));ctx.lineWidth=4;ctx.stroke();ctx.lineWidth=2;}
   continue;
  }else if(target.kind==='environment'){
   const h=handles[target.id];if(!h)continue;
   ctx.strokeRect(h.screen.x-h.screenWidth/2-3,h.screen.y-h.screenHeight/2-3,h.screenWidth+6,h.screenHeight+6);
   continue;
  }else if(target.kind==='startFinish'){
   if(d.startFinishLine){polygon([d.startFinishLine.start,d.startFinishLine.end].map(p=>R.screenAt(p,t)));ctx.stroke();}
   continue;
  }else{
   const item=({mark:d.marks,label:d.labels,line:d.lines,area:d.areas}[target.kind]||[]).find(a=>a.id===target.id);
   if(!item)continue;
   if(item.points){
    polygon(item.points.map(p=>R.screenAt(p,t)));
    if(target.kind==='area'){ctx.closePath();ctx.fill();}
    ctx.stroke();continue;
   }
   point=item.point;
  }
  if(point){
   const q=R.screenAt(point,t);ctx.beginPath();ctx.arc(q.x,q.y,radius,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
 }
 ctx.restore();
}

return {};
})();

})();</script></body></html>
